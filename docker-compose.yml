# Фаза 2 докеризации (docs/notes.md) — поверх уже работающего перехода на
# PostgreSQL (фаза 1). Секреты (TELEGRAM_BOT_TOKEN/INTERNAL_API_KEY/
# POSTGRES_*) тянутся из .env через ${...} — compose подхватывает .env из
# корня автоматически. DATABASE_URL/API_BASE_URL здесь заданы явно под
# имена сервисов этой сети (db/api), а не взяты из .env буквально — там
# они про localhost/127.0.0.1, для запуска процессами на хосте.
#
# ${VAR:?сообщение} (docs/hardening_plan.md, этап 2) — Compose сам
# откажется стартовать, если переменной нет в .env, вместо того чтобы
# тихо передать пустую строку в контейнер (пустой INTERNAL_API_KEY у api
# и у bot совпал бы сам с собой и выглядел бы "рабочим").

# Ротация логов Docker (docs/hardening_plan.md, этап 3) — без неё логи
# контейнеров растут без предела (в отличие от файлового лога бота,
# bot/main.py, который сам себя ротирует). Один якорь на все три сервиса,
# не три одинаковых блока — заодно защищает и соседний проект на той же ВМ
# от переполнения диска этим стеком.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16.15
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?нужен POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?нужен POSTGRES_DB в .env}
    volumes:
      - rpg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  api:
    build: .
    image: rpg-tele-bot:latest
    command: sh -c "alembic upgrade head && exec uvicorn api.main:app --host 0.0.0.0 --port 8000"
    logging: *default-logging
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?нужен INTERNAL_API_KEY в .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m

  bot:
    image: rpg-tele-bot:latest
    command: python -m bot.main
    logging: *default-logging
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?нужен TELEGRAM_BOT_TOKEN в .env}
      API_BASE_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?нужен INTERNAL_API_KEY в .env}
    volumes:
      # docs/notes.md — файловый лог (bot/main.py) пишет сюда; bind mount
      # в поддиректорию репозитория, не общесерверную, и переживает
      # docker compose up -d --build (writable-слой контейнера при
      # пересборке пересоздаётся, этот том — нет).
      - ./logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 384m

volumes:
  rpg_pgdata:
    external: true
